{{ define "main" }}
  {{ $portrait := .Params.portrait | default "/images/A propos/simon2.jpg" }}
  {{ $ctaLabel := .Params.cta_label | default "Me contacter" }}

  <section class="contact-page contact-page--about">
    <div class="contact-page__visual" aria-hidden="true">
      <img src="{{ $portrait | relURL }}" alt="" />
    </div>

    <div class="contact-page__panel">
      <h1 class="contact-page__title is-fit" data-fit-title>{{ .Title }}</h1>
      <p class="contact-page__eyebrow">Simon Cramar</p>

      {{ with .Params.lead }}
        <p class="contact-page__lead">{{ . }}</p>
      {{ end }}

      {{ with .Content }}
        <div class="contact-page__intro">
          {{ . }}
        </div>
      {{ end }}

      <a class="btn-cta contact-page__cta" href="{{ "/contact/" | relURL }}">{{ $ctaLabel }}</a>
    </div>
  </section>
{{ end }}
